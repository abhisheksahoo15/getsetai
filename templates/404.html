<!-- templates/employee/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top, rgba(92,116,255,.15), transparent 60%),
                  radial-gradient(circle at bottom, rgba(14,165,233,.15), transparent 60%),
                  #0b1020;
      color: #f8fafc;
    }
    .glass {
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom right, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.12);
    }
    .gtext {
      background: linear-gradient(90deg, #a6b6ff, #67e8f9, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="h-screen flex items-center justify-center">

  <div class="glass rounded-3xl p-10 shadow-2xl text-center max-w-lg w-full float">
    <h1 class="text-6xl font-extrabold gtext mb-4">404</h1>
    <p class="text-xl text-slate-300 mb-6">
      Oops! The employee you are looking for was not found.
    </p>
    <a href="/" class="inline-block px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-sky-500 text-white shadow-lg hover:scale-105 transition-transform">
      Go Back Home
    </a>
  </div>

</body>
</html>
