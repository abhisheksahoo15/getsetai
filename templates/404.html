<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | 404</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Outfit for a modern, clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            overflow: hidden; /* Prevent scrolling from animated blobs */
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float-blob 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #c4b5fd; /* Soft Purple */
            animation-delay: 0s;
        }
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: #bae6fd; /* Soft Blue */
            animation-delay: 2s;
        }
        .blob-3 {
            top: 40%;
            left: 40%;
            width: 400px;
            height: 400px;
            background: #fde68a; /* Soft Yellow */
            animation-delay: 4s;
            opacity: 0.4;
        }

        @keyframes float-blob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Glass Card Light Mode */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        /* Typography Gradients */
        .text-gradient {
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 3D Floating Number Animation */
        .float-element {
            animation: float-y 6s ease-in-out infinite;
        }
        @keyframes float-y {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Button Hover Effect */
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center relative">

    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Pattern Overlay (Subtle Grid) -->
    <div class="absolute inset-0 z-[-1] opacity-[0.03]" 
         style="background-image: radial-gradient(#475569 1px, transparent 1px); background-size: 32px 32px;">
    </div>

    <!-- Main Container -->
    <main class="glass-card p-10 md:p-16 rounded-3xl max-w-2xl w-[90%] mx-4 text-center relative overflow-hidden">
        
        <!-- Decorative Circle top-right -->
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-32 h-32 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-full opacity-50"></div>

        <!-- 404 Graphic Area -->
        <div class="relative mb-8 inline-block">
            <h1 class="text-9xl font-black text-slate-200 select-none">404</h1>
            <div class="absolute inset-0 flex items-center justify-center float-element">
                <!-- Overlaying "Page Not Found" text with gradient -->
                <span class="text-4xl md:text-5xl font-bold text-gradient bg-white/80 px-4 py-2 rounded-xl backdrop-blur-sm shadow-sm border border-white/50">
                    Whoops!
                </span>
            </div>
        </div>

        <!-- Message -->
        <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4">
            We can't seem to find that page.
        </h2>
        <p class="text-slate-500 text-lg mb-10 leading-relaxed max-w-md mx-auto">
            The link you followed might be broken, or the page may have been removed. Don't worry, the homepage is just around the corner.
        </p>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <a href="/" class="btn-hover px-8 py-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl font-semibold shadow-lg shadow-blue-500/20 flex items-center gap-2">
                <i class="fa-solid fa-house"></i>
                Back to Home
            </a>
            
            <a href="javascript:history.back()" class="px-8 py-4 bg-white text-slate-600 border border-slate-200 rounded-xl font-semibold hover:bg-slate-50 transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                Go Back
            </a>
        </div>

        <!-- Bottom Text -->
        <div class="mt-12 text-sm text-slate-400 font-medium">
            Error Code: 404_NOT_FOUND
        </div>
    </main>

</body>
</html>
