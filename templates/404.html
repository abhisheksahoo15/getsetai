<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #00D2B4, #0096FF);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
    }

    a {
      margin-top: 2rem;
      padding: 0.8rem 1.5rem;
      background: #1A1762;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.3s;
    }

    a:hover {
      background: #2E2C6C;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! Page not found. The URL you entered doesn't exist.</p>
  <a href="/">Go Back to Home</a>
</body>
</html>
