<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='logo.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #0096FF;
      --secondary: #00D2B4;
      --dark: #0f172a;
    }

    /* Logo Glow Animation */
    @keyframes logoGlow {
      0% { filter: drop-shadow(0 0 5px var(--primary)); }
      50% { filter: drop-shadow(0 0 15px var(--secondary)); }
      100% { filter: drop-shadow(0 0 5px #ff00cc); }
    }

    /* Fade In Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-[Segoe_UI] pt-20">

  <!-- ✅ Navbar -->
  <header class="fixed top-0 left-0 w-full z-50 bg-gradient-to-r from-teal-400 to-sky-500 shadow-lg flex justify-between items-center px-6 py-4 transition-all">
    <div class="logo">
      <h2 class="text-2xl font-bold tracking-wide bg-gradient-to-r from-pink-500 via-sky-400 to-teal-300 bg-clip-text text-transparent animate-[logoGlow_4s_linear_infinite]">
        GetSetAI Innovations
      </h2>
    </div>
    <div class="menu-toggle md:hidden flex flex-col cursor-pointer" onclick="toggleMenu()">
      <span class="w-6 h-[3px] bg-white my-[3px] rounded"></span>
      <span class="w-6 h-[3px] bg-white my-[3px] rounded"></span>
      <span class="w-6 h-[3px] bg-white my-[3px] rounded"></span>
    </div>
    <nav id="navbar" class="hidden md:flex gap-6 font-medium text-white">
      <a href="/" class="hover:underline">Home</a>
      <a href="/about/" class="hover:underline">About</a>
      <a href="/gallery/" class="hover:underline">Past Events</a>
      <a href="/employees/" class="hover:underline">Our Team</a>
      <a href="/contact/" class="hover:underline">Contact</a>
    </nav>
  </header>

  <!-- ✅ Title -->
  <h1 class="fade-in text-4xl font-bold text-center my-10 bg-gradient-to-r from-teal-400 to-sky-500 bg-clip-text text-transparent">
    {{ title }}
  </h1>

  <!-- ✅ Employee Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 px-6 max-w-6xl mx-auto">
    {% for emp in employees %}
      <a href="/employee/{{ emp.community_id }}" class="no-underline text-inherit">
        <div class="fade-in bg-white/50 backdrop-blur-md rounded-2xl shadow-lg hover:shadow-xl hover:scale-105 transition-transform p-6 text-center border border-white/30">
          <img src="{{ emp.image if emp.image else '/static/images/employee/default.jpg' }}" alt="{{ emp.name }}" class="w-28 h-28 mx-auto rounded-full object-cover border-2 border-sky-400 shadow-md hover:scale-110 transition-transform" />
          <h2 class="text-xl font-semibold text-sky-600 mt-4">{{ emp.name }}</h2>
          <p class="text-gray-700"><span class="font-bold">Designation:</span> {{ emp.designation }}</p>
          <p class="text-gray-700"><span class="font-bold">Branch:</span> {{ emp.branch }}</p>
          <p class="text-gray-500 text-sm"><span class="font-bold">Company ID:</span> {{ emp.community_id or 'N/A' }}</p>
        </div>
      </a>
    {% endfor %}
  </div>

  <!-- ✅ Footer -->
  <footer class="text-center mt-12 bg-gradient-to-r from-teal-400 to-sky-500 text-white py-4">
    © 2025 GetSetAI Community | Built for Innovators
  </footer>

  <!-- ✅ Script -->
  <script>
    function toggleMenu() {
      document.getElementById('navbar').classList.toggle('hidden');
      document.getElementById('navbar').classList.toggle('flex');
      document.getElementById('navbar').classList.toggle('flex-col');
      document.getElementById('navbar').classList.toggle('bg-slate-900');
      document.getElementById('navbar').classList.toggle('absolute');
      document.getElementById('navbar').classList.toggle('right-0');
      document.getElementById('navbar').classList.toggle('top-16');
      document.getElementById('navbar').classList.toggle('p-4');
    }

    // Scroll fade-in animation
    const elements = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.animationPlayState = "running";
        }
      });
    }, { threshold: 0.2 });

    elements.forEach(el => observer.observe(el));
  </script>
</body>
</html>
